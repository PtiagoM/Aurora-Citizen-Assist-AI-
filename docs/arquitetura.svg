    <g font-size="17" font-weight="700" text-anchor="middle">
      <text x="142" y="138">Terminal ou Streamlit</text>
      <text x="408" y="138">Validação local</text>
      <text x="674" y="138">Agente LangChain</text>
      <text x="959" y="138">Ferramenta de consulta</text>
      <text x="959" y="225">Gemini Developer API</text>
      <text x="142" y="363">Conjunto do professor</text>
      <text x="408" y="363">Resposta do agente</text>
      <text x="674" y="363">LLM-as-a-Judge</text>
      <text x="959" y="363">Resultados por caso</text>
    </g>
    <g fill="#385569" font-size="14" text-anchor="middle">
      <text x="142" y="162">Menu e pergunta livre</text>
      <text x="408" y="162">Entrada e privacidade</text>
      <text x="674" y="162">Orientação com fontes</text>
