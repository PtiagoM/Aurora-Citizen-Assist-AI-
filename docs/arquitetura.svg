<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="452" viewBox="0 0 1120 452" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Arquitetura do Aurora Citizen Assist AI</title>
  <desc id="descricao">No atendimento, terminal ou Streamlit valida a entrada antes de chamar o agente LangChain. O agente usa as fichas locais e o Gemini. Na avaliação, o programa lê o conjunto do professor, obtém uma resposta do agente, consulta o juiz e grava o resultado por caso.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315974"/>
    </marker>
  </defs>
  <rect width="1120" height="452" fill="#f2f6fa" rx="16"/>
  <g font-family="Arial, sans-serif" fill="#142f45">
    <text x="32" y="45" font-size="27" font-weight="700">Aurora Citizen Assist AI</text>
    <text x="32" y="84" font-size="16" font-weight="700" fill="#285875">ATENDIMENTO</text>
    <text x="32" y="310" font-size="16" font-weight="700" fill="#285875">AVALIAÇÃO SEPARADA DO ATENDIMENTO</text>
    <g fill="#ffffff" stroke="#9eb5c6" stroke-width="1.5">
      <rect x="32" y="105" width="220" height="82" rx="9"/>
      <rect x="298" y="105" width="220" height="82" rx="9"/>
      <rect x="564" y="105" width="220" height="82" rx="9" fill="#e0f0f7"/>
      <rect x="830" y="105" width="258" height="82" rx="9"/>
      <rect x="830" y="200" width="258" height="60" rx="9"/>
      <rect x="32" y="330" width="220" height="82" rx="9"/>
      <rect x="298" y="330" width="220" height="82" rx="9"/>
      <rect x="564" y="330" width="220" height="82" rx="9"/>
      <rect x="830" y="330" width="258" height="82" rx="9"/>
    </g>
    <g stroke="#315974" stroke-width="2.4" fill="none" marker-end="url(#seta)">
      <path d="M252 146 H291"/>
      <path d="M518 146 H557"/>
      <path d="M790 146 H823" marker-start="url(#seta)"/>
      <path d="M674 194 V230 H823" marker-start="url(#seta)"/>
      <path d="M635 187 V250 H142 V194"/>
      <path d="M252 371 H291"/>
      <path d="M518 371 H557"/>
      <path d="M784 371 H823"/>
